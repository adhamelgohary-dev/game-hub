name: Windows

on:
  push:
    branches: ['**']
    tags: ['v*']

permissions:
  contents: read

jobs:
  test:
    name: Tests and lint
    runs-on: windows-2025
    timeout-minutes: 10
    env:
      QT_QPA_PLATFORM: offscreen
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip uninstall -y opencv-python
      - name: Run tests
        run: python -m pytest
      - name: Lint
        run: python -m ruff check .
      - name: Smoke test source application
        run: python -m gamehub.app --smoke-test

  release:
    name: Build and publish release
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v')
    needs: test
    runs-on: windows-2025
    timeout-minutes: 25
    concurrency:
      group: windows-release-${{ github.ref }}
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1
        with:
          python-version: '3.12'
          architecture: x64
      - name: Install dependencies
        run: |
          python -m pip install -r requirements.txt -r requirements-dev.txt
          python -m pip uninstall -y opencv-python
      - name: Build the portable application
        run: |
          $tag = $env:GITHUB_REF_NAME
          $python = python -c 'import sys; print(sys.base_prefix); print(sys.version.split()[0])'
          if ($LASTEXITCODE -ne 0) { throw 'Could not identify the CPython installation.' }
          if (!(Test-Path -LiteralPath (Join-Path $python[0] 'LICENSE.txt') -PathType Leaf)) {
            $env:GAMEHUB_CPYTHON_LICENSE = Join-Path $env:RUNNER_TEMP 'LICENSE.txt'
            Invoke-WebRequest -Uri "https://raw.githubusercontent.com/python/cpython/v$($python[1])/LICENSE" `
              -OutFile $env:GAMEHUB_CPYTHON_LICENSE -TimeoutSec 30
          }
          python -m PyInstaller --noconfirm --clean packaging/gamerewind.spec
          if ($LASTEXITCODE -ne 0) { throw "PyInstaller failed ($LASTEXITCODE)." }
          Compress-Archive -LiteralPath dist/GameRewind -DestinationPath "dist/GameRewind-Portable-$tag.zip"
      - name: Verify bundle size and excluded binaries gate
        run: |
          $tag = $env:GITHUB_REF_NAME
          $maxUnpackedBytes = 200MB
          $maxZipBytes = 70MB
          $unpackedBytes = (Get-ChildItem -LiteralPath 'dist/GameRewind' -Recurse -File | Measure-Object Length -Sum).Sum
          $zipBytes = (Get-Item -LiteralPath "dist/GameRewind-Portable-$tag.zip").Length
          Write-Host ("Installed folder: {0:N2} MiB ({1} bytes) | Limit: 200 MiB" -f ($unpackedBytes / 1MB), $unpackedBytes)
          Write-Host ("Portable zip:     {0:N2} MiB ({1} bytes) | Limit: 70 MiB" -f ($zipBytes / 1MB), $zipBytes)
          if ($unpackedBytes -gt $maxUnpackedBytes) {
            throw "Installed bundle size ($unpackedBytes bytes) exceeds 200 MiB limit!"
          }
          if ($zipBytes -gt $maxZipBytes) {
            throw "Portable zip size ($zipBytes bytes) exceeds 70 MiB limit!"
          }
          $forbidden = Get-ChildItem -LiteralPath 'dist/GameRewind' -Recurse -File | Where-Object {
            $_.Name -match '(?i)^(cv2\.pyd|opencv_|.*psutil.*|opengl32sw\.dll|qt6qml|qt6quick)'
          }
          if ($forbidden) {
            $names = ($forbidden | ForEach-Object Name) -join ', '
            throw "Forbidden binary found in dist/GameRewind: $names"
          }
      - name: Build the per-user installer
        run: |
          $compiler = Join-Path ${env:ProgramFiles(x86)} 'Inno Setup 6/ISCC.exe'
          if (!(Test-Path -LiteralPath $compiler -PathType Leaf)) {
            throw 'Inno Setup 6 is unavailable on this runner.'
          }
          $tag = $env:GITHUB_REF_NAME
          $version = $tag.TrimStart('v')
          $setupBase = "GameRewind-Setup-$tag"
          & $compiler "/DAppVersion=$version" "/DOutputFilename=$setupBase" 'packaging/installer.iss'
          if ($LASTEXITCODE -ne 0) { throw "Inno Setup failed ($LASTEXITCODE)." }
      - name: Smoke test portable, fresh custom folder, legacy upgrade, folder change, and uninstall
        env:
          QT_QPA_PLATFORM: offscreen
        run: |
          $tag = $env:GITHUB_REF_NAME
          function Test-GameRewind($applicationDir) {
            $exe = Join-Path $applicationDir 'GameRewind.exe'
            foreach ($rel in @(
              '_internal/third-party/THIRD_PARTY_NOTICES.txt',
              '_internal/third-party/Qt/LGPL-3.0.txt',
              '_internal/third-party/FFmpeg/LGPL-2.1.txt',
              '_internal/gamehub/core/protection/protected_games.json'
            )) {
              $file = Join-Path $applicationDir $rel
              if (!(Test-Path -LiteralPath $file -PathType Leaf)) {
                throw "The application package is missing required file ($rel): $applicationDir"
              }
            }
            $savedPath = $env:PATH
            $savedPythonHome = $env:PYTHONHOME
            $savedPythonPath = $env:PYTHONPATH
            try {
              $env:PATH = "$env:SystemRoot\System32;$env:SystemRoot"
              Remove-Item Env:PYTHONHOME -ErrorAction SilentlyContinue
              Remove-Item Env:PYTHONPATH -ErrorAction SilentlyContinue
              $process = Start-Process -FilePath $exe -ArgumentList '--smoke-test' `
                -WorkingDirectory $env:RUNNER_TEMP -WindowStyle Hidden -Wait -PassThru
              if ($process.ExitCode -ne 0) { throw "GameRewind smoke test failed ($($process.ExitCode))." }
            } finally {
              $env:PATH = $savedPath
              if ($null -ne $savedPythonHome) { $env:PYTHONHOME = $savedPythonHome }
              if ($null -ne $savedPythonPath) { $env:PYTHONPATH = $savedPythonPath }
            }
          }

          # 1. Portable package smoke test
          $portable = Join-Path $env:RUNNER_TEMP 'GameRewind Portable'
          Expand-Archive -LiteralPath "dist/GameRewind-Portable-$tag.zip" -DestinationPath $portable
          Test-GameRewind (Join-Path $portable 'GameRewind')

          # 2. Seed synthetic legacy Game Hub Run key, Uninstall key, Start Menu dir, and %LOCALAPPDATA%\GameHub data
          $runKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Run'
          New-Item -Path $runKey -Force | Out-Null
          Set-ItemProperty -Path $runKey -Name 'GameHub' -Value '"C:\Legacy\GameHub.exe"'

          $legacyUninstKey = 'HKCU:\Software\Microsoft\Windows\CurrentVersion\Uninstall\{BCE7FA2A-7A55-487B-9BC4-2EA83958BF9A}_is1'
          New-Item -Path $legacyUninstKey -Force | Out-Null
          Set-ItemProperty -Path $legacyUninstKey -Name 'DisplayName' -Value 'Game Hub'

          $legacyStartMenu = Join-Path ([Environment]::GetFolderPath('Programs')) 'Game Hub'
          New-Item -ItemType Directory -Path $legacyStartMenu -Force | Out-Null
          Set-Content -LiteralPath (Join-Path $legacyStartMenu 'legacy.txt') -Value 'old' -Encoding utf8

          $legacyData = Join-Path $env:LOCALAPPDATA 'GameHub'
          New-Item -ItemType Directory -Path $legacyData -Force | Out-Null
          $legacyCanary = Join-Path $legacyData 'legacy-canary.txt'
          Set-Content -LiteralPath $legacyCanary -Value 'preserve-me' -Encoding utf8

          # 3. Fresh install to custom folder A (with desktop shortcut task)
          $customDirA = Join-Path $env:RUNNER_TEMP 'CustomFolderA\GameRewind'
          $setup = (Resolve-Path -LiteralPath "dist/GameRewind-Setup-$tag.exe").Path
          $installArgsA = '/VERYSILENT /SUPPRESSMSGBOXES /SP- /NORESTART /TASKS="desktopicon" /DIR="{0}"' -f $customDirA
          $process = Start-Process -FilePath $setup -ArgumentList $installArgsA `
            -WindowStyle Hidden -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw "GameRewind fresh install failed ($($process.ExitCode))." }
          Test-GameRewind $customDirA

          $remainingRun = (Get-ItemProperty -Path $runKey -Name 'GameHub' -ErrorAction SilentlyContinue).GameHub
          if ($null -ne $remainingRun) { throw 'Legacy HKCU Run\GameHub entry was not removed.' }
          if (Test-Path -LiteralPath $legacyUninstKey) { throw 'Legacy Game Hub uninstall key was not removed.' }
          if (Test-Path -LiteralPath $legacyStartMenu) { throw 'Legacy Game Hub Start Menu folder was not removed.' }
          if (!(Test-Path -LiteralPath $legacyCanary -PathType Leaf)) { throw 'Legacy GameHub user data was unexpectedly removed.' }

          $desktopShortcut = Join-Path ([Environment]::GetFolderPath('Desktop')) 'GameRewind.lnk'
          if (!(Test-Path -LiteralPath $desktopShortcut -PathType Leaf)) { throw 'Desktop shortcut task did not create GameRewind.lnk.' }

          # 4. Upgrade to a DIFFERENT custom folder B and confirm old folder A is cleaned up
          $userData = Join-Path $env:LOCALAPPDATA 'GameRewind'
          New-Item -ItemType Directory -Path $userData -Force | Out-Null
          $canary = Join-Path $userData 'upgrade-canary.txt'
          Set-Content -LiteralPath $canary -Value 'preserve-me' -Encoding utf8

          $customDirB = Join-Path $env:RUNNER_TEMP 'CustomFolderB\GameRewind'
          $installArgsB = '/VERYSILENT /SUPPRESSMSGBOXES /SP- /NORESTART /DIR="{0}"' -f $customDirB
          $upgrade = Start-Process -FilePath $setup -ArgumentList $installArgsB `
            -WindowStyle Hidden -Wait -PassThru
          if ($upgrade.ExitCode -ne 0) { throw "GameRewind folder-change upgrade failed ($($upgrade.ExitCode))." }
          Test-GameRewind $customDirB
          if (Test-Path -LiteralPath (Join-Path $customDirA 'GameRewind.exe')) {
            throw 'Previous GameRewind.exe remained in CustomFolderA after upgrading to CustomFolderB.'
          }

          # 5. Uninstall from custom folder B and confirm clean removal + user data preservation
          $uninstaller = Join-Path $customDirB 'unins000.exe'
          if (!(Test-Path -LiteralPath $uninstaller -PathType Leaf)) {
            throw "Uninstaller missing after installation: $uninstaller"
          }
          $remove = Start-Process -FilePath $uninstaller `
            -ArgumentList '/VERYSILENT /SUPPRESSMSGBOXES /NORESTART' `
            -WindowStyle Hidden -Wait -PassThru
          if ($remove.ExitCode -ne 0) { throw "GameRewind uninstall failed ($($remove.ExitCode))." }
          if (Test-Path -LiteralPath (Join-Path $customDirB 'GameRewind.exe')) {
            throw 'GameRewind.exe still exists after uninstall.'
          }
          if (!(Test-Path -LiteralPath $canary -PathType Leaf)) {
            throw 'User data was unexpectedly removed during upgrade or uninstall.'
          }
          Remove-Item -LiteralPath $canary -Force
          Remove-Item -LiteralPath $legacyCanary -Force

      - name: Security verify PE manifest, no UPX, and Windows Defender scan
        run: |
          $exe = (Resolve-Path -LiteralPath 'dist/GameRewind/GameRewind.exe').Path
          $setup = (Resolve-Path -LiteralPath "dist/GameRewind-Setup-$($env:GITHUB_REF_NAME).exe").Path
          python -c "
          from pathlib import Path
          exe_bytes = Path(r'$exe').read_bytes()
          assert b'asInvoker' in exe_bytes, 'Missing asInvoker manifest in GameRewind.exe'
          assert b'requireAdministrator' not in exe_bytes, 'Forbidden requireAdministrator in GameRewind.exe'
          assert b'highestAvailable' not in exe_bytes, 'Forbidden highestAvailable in GameRewind.exe'
          assert 'FileVersion'.encode('utf-16le') in exe_bytes, 'Missing VERSIONINFO FileVersion in GameRewind.exe'
          assert 'GameRewind.exe'.encode('utf-16le') in exe_bytes, 'Missing VERSIONINFO OriginalFilename in GameRewind.exe'
          for p in Path('dist/GameRewind').rglob('*'):
              if p.is_file() and p.suffix.lower() in ('.exe', '.dll', '.pyd'):
                  head = p.read_bytes()[:4096]
                  assert b'UPX0' not in head and b'UPX!' not in head, f'UPX marker in {p}'
          print('PE manifest, VERSIONINFO, and zero-UPX checks passed.')
          "
          if ($LASTEXITCODE -ne 0) { throw "PE manifest/UPX security verification failed ($LASTEXITCODE)." }
          $mp = Join-Path $env:ProgramFiles 'Windows Defender\MpCmdRun.exe'
          $svc = Get-Service -Name WinDefend -ErrorAction SilentlyContinue
          if ((Test-Path -LiteralPath $mp -PathType Leaf) -and $null -ne $svc -and $svc.Status -eq 'Running') {
            foreach ($target in @((Resolve-Path -LiteralPath 'dist/GameRewind').Path, $setup)) {
              $scanOut = & $mp -Scan -ScanType 3 -DisableRemediation -File $target 2>&1 | Out-String
              $code = $LASTEXITCODE
              Write-Host $scanOut
              if ($code -ne 0) {
                if ($scanOut -match '0x80004005') {
                  Write-Warning "Windows Defender scanning is disabled on this runner; skipping scan for $target."
                } else {
                  throw "Windows Defender scan failed on $target ($code)."
                }
              }
            }
          } else {
            Write-Warning 'WinDefend service is not running on this runner; skipping Defender scan.'
          }

      # SignPath Foundation free open-source code signing (disabled until approved; enable via vars.SIGNPATH_ENABLED == 'true').
      # Note: once SignPath project policy is live, extend signing to cover both GameRewind.exe (before Inno Setup) and GameRewind-Setup.
      - name: Upload unsigned installer for SignPath
        if: vars.SIGNPATH_ENABLED == 'true'
        id: upload-unsigned
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: unsigned-installer-${{ github.ref_name }}
          path: dist/GameRewind-Setup-${{ github.ref_name }}.exe
          retention-days: 1

      - name: Sign installer via SignPath Foundation
        if: vars.SIGNPATH_ENABLED == 'true'
        uses: signpath/github-action-submit-signing-request@a2c5b60d9c75f073142b653c354b632eedce097b
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ secrets.SIGNPATH_ORG_ID }}
          project-slug: game-rewind
          signing-policy-slug: release
          github-artifact-id: ${{ steps.upload-unsigned.outputs.artifact-id }}
          wait-for-completion: true
          output-artifact-directory: dist/signed

      - name: Replace installer with SignPath-signed executable
        if: vars.SIGNPATH_ENABLED == 'true'
        run: |
          $tag = $env:GITHUB_REF_NAME
          $signed = Get-ChildItem -LiteralPath 'dist/signed' -Filter '*.exe' | Select-Object -First 1
          if ($null -eq $signed) { throw 'SignPath did not return a signed installer.' }
          Move-Item -LiteralPath $signed.FullName -Destination "dist/GameRewind-Setup-$tag.exe" -Force

      - name: Generate SHA256SUMS.txt
        run: |
          $tag = $env:GITHUB_REF_NAME
          $files = @("dist/GameRewind-Setup-$tag.exe", "dist/GameRewind-Portable-$tag.zip")
          $lines = foreach ($f in $files) {
            $hash = (Get-FileHash -LiteralPath $f -Algorithm SHA256).Hash.ToLowerInvariant()
            "$hash  $(Split-Path -Leaf $f)"
          }
          Set-Content -LiteralPath 'dist/SHA256SUMS.txt' -Value $lines -Encoding ascii

      - name: Publish SemVer GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $repo = $env:GITHUB_REPOSITORY
          $tag = $env:GITHUB_REF_NAME
          $isPrerelease = $tag -like '*-*'

          $changelog = Get-Content -LiteralPath CHANGELOG.md -Raw
          $pattern = '(?ms)^##[ \t]+{0}[ \t]*\r?\n(.*?)(?=^##[ \t]+|\z)' -f [regex]::Escape($tag)
          $match = [regex]::Match($changelog, $pattern)
          if (!$match.Success -or [string]::IsNullOrWhiteSpace($match.Groups[1].Value)) {
            throw "CHANGELOG.md needs a nonempty ## $tag section."
          }
          $notesPath = Join-Path $env:RUNNER_TEMP 'gamerewind-release-notes.md'
          Set-Content -LiteralPath $notesPath -Value $match.Groups[1].Value.Trim() -Encoding utf8
          $title = "GameRewind $tag"
          $assets = @(
            "dist/GameRewind-Setup-$tag.exe",
            "dist/GameRewind-Portable-$tag.zip",
            "dist/SHA256SUMS.txt"
          )
          $existing = gh release view $tag --repo $repo --json name,isDraft,assets 2>$null
          if ($LASTEXITCODE -ne 0) {
            $createArgs = @('release', 'create', $tag, '--repo', $repo, '--verify-tag', '--title', $title, '--notes-file', $notesPath)
            if ($isPrerelease) { $createArgs += '--prerelease' }
            $createArgs += $assets
            & gh @createArgs
          } else {
            $release = $existing | ConvertFrom-Json
            if (!$release.isDraft) {
              $uploaded = @($release.assets | Where-Object state -eq uploaded | ForEach-Object name)
              foreach ($asset in $assets) {
                if ((Split-Path -Leaf $asset) -notin $uploaded) {
                  throw "The published release is missing a required asset: $asset"
                }
              }
              Write-Host "GameRewind $tag is already published with all Windows assets."
              exit 0
            }
            if ($release.name -ne $title) { throw "An unrelated draft exists for $tag." }
            gh release upload $tag --repo $repo --clobber @assets
            if ($LASTEXITCODE -ne 0) { throw "GitHub asset upload failed ($LASTEXITCODE)." }
            $editArgs = @('release', 'edit', $tag, '--repo', $repo, '--draft=false', '--notes-file', $notesPath)
            if ($isPrerelease) { $editArgs += '--prerelease' }
            & gh @editArgs
          }
          if ($LASTEXITCODE -ne 0) { throw "GitHub release failed ($LASTEXITCODE)." }
